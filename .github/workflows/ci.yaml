# CI: chạy kiểm tra tự động mỗi khi push lên main hoặc mở Pull Request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nếu có commit mới đẩy lên cùng branch, huỷ lần chạy cũ đang dở cho đỡ tốn thời gian.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI chỉ cần quyền đọc code.
permissions:
  contents: read

jobs:
  # Backend: cài dependencies và chạy pytest
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # khớp với image python:3.11-slim trong backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Cài PyTorch bản CPU trước. Mặc định pip kéo bản kèm CUDA (vài GB), CI không có GPU nên thừa.
      # Khi cài requirements.txt, ultralytics thấy torch đã có nên không cài lại.
      - name: Install PyTorch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx # pytest/httpx chỉ cần cho test, không nằm trong requirements.txt

      # yolov8n.pt được Ultralytics tự tải vào thư mục backend/ ở lần chạy đầu.
      # Cache lại để các lần CI sau không phải tải lại.
      - name: Cache YOLO weights
        uses: actions/cache@v4
        with:
          path: backend/yolov8n.pt
          key: yolov8n-weights

      - name: Run tests
        run: python -m pytest tests/ -v

  # Frontend: lint và build thử 
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # khớp với node:22-alpine trong frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci cài đúng theo package-lock.json (khác npm install là không tự sửa lock file).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build thành công nghĩa là code không có lỗi import/cú pháp.
      - name: Build
        run: npm run build

  # Docker: kiểm tra 2 image build được 
  # Chỉ build, KHÔNG push đi đâu. Chạy sau khi test/lint đã qua để khỏi build image khi code đang lỗi.
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          # Dùng cache của GitHub Actions để các lần build sau nhanh hơn.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}